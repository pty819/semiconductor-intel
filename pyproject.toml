[project]
name = "intel"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]", "sqlalchemy[asyncio]>=2.0.36", "asyncpg",
  "alembic", "pydantic>=2.9", "pydantic-settings", "httpx", "feedparser",
  "beautifulsoup4", "lxml", "pypdf", "python-multipart", "argon2-cffi",
  "msgpack", "structlog",
  # Browser rendering fallback for JS-required pages (Task 7). The
  # browser binaries are NOT installed in the offline dev environment;
  # the renderer degrades to outcome=browser_unavailable instead.
  "playwright",
  # NOOA agent framework, pinned to an exact upstream commit via
  # tool.uv.sources below (uv fetches it straight from GitHub).
  "nooa",
]

[project.scripts]
intel = "intel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intel"]

[dependency-groups]
# NOTE: the plan's dev group listed "types-feedparser", but no such package
# exists on PyPI (typeshed never published it; feedparser ships no py.typed).
# Removed until a stub source actually exists.
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]
docs = [
  "sphinx>=8.2",
  "myst-parser>=4.0",
  "sphinx-rtd-theme>=3.0",
  "sphinxcontrib-mermaid>=1.0",
]

[tool.uv.sources]
nooa = { git = "https://github.com/NVIDIA-NeMo/labs-OO-Agents.git", rev = "d4d46f78ae0eeaed7d18a466196601e8d16bc101" }

[tool.pytest.ini_options]
markers = ["integration: needs real Postgres", "live: needs network/provider"]
addopts = "-m 'not integration and not live'"
asyncio_mode = "auto"

[tool.ruff.lint]
# PIE790 (unnecessary `...`) MUST stay off: a docstring followed by `...`
# is NOOA's generation-stub idiom — the ellipsis IS the marker that makes
# the method LLM-generated. Removing it turns a generation method into a
# plain Python method returning None.
ignore = ["PIE790"]

[tool.ruff.lint.per-file-ignores]
# models.py is a byte-for-byte copy of the design pack (single source of
# truth for DTOs). Its unused `datetime` import exists upstream; editing it
# here would break verbatim tracking. Do not "fix" this file.
"src/intel/contracts/models.py" = ["F401"]
