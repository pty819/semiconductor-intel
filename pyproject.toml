[project]
name = "intel"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]", "sqlalchemy[asyncio]>=2.0.36", "asyncpg",
  "alembic", "pydantic>=2.9", "pydantic-settings", "httpx", "feedparser",
  "beautifulsoup4", "lxml", "pypdf", "python-multipart", "argon2-cffi",
  "msgpack", "structlog",
  # NOOA agent framework, pinned to the local checkout (d4d46f7) via tool.uv.sources below.
  "nooa",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intel"]

[dependency-groups]
# NOTE: the plan's dev group listed "types-feedparser", but no such package
# exists on PyPI (typeshed never published it; feedparser ships no py.typed).
# Removed until a stub source actually exists.
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.uv.sources]
nooa = { path = "/Users/liyifan/Documents/labs-OO-Agents", editable = true }

[tool.pytest.ini_options]
markers = ["integration: needs real Postgres", "live: needs network/provider"]
addopts = "-m 'not integration and not live'"
