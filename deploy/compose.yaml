# semiconductor-intel compose (spec 10 §4).
#
# Default runtime: Postgres and the OpenAI-v1 LLM on 192.168.1.82.
# NAS 192.168.1.21 is optional (HOST= in deploy/postgres/setup.sh) and is
# NOT required for this stack.
#
#   docker compose -f deploy/compose.yaml config
#   docker compose -f deploy/compose.yaml up --build
#
# Local Postgres (the pgvector image in deploy/postgres) instead of 82:
#   INTEL_DATABASE_URL=postgresql+asyncpg://postgres:${PG_PASSWORD}@postgres:5432/postgres \
#     docker compose -f deploy/compose.yaml --profile local-db up --build
#
# Frontend: reverse-proxy serves web/dist and proxies /api → api:8000.
# Local Vue hot-reload without compose: `cd web && pnpm dev` (port 5173).

name: semiconductor-intel

x-app-environment: &app-environment
  INTEL_DATABASE_URL: ${INTEL_DATABASE_URL:-postgresql+asyncpg://postgres:${PG_PASSWORD}@192.168.1.82:5432/postgres}
  INTEL_OBJECT_STORE_ROOT: ${INTEL_OBJECT_STORE_ROOT:-/var/lib/intel/objects}
  INTEL_SESSION_PEPPER: ${INTEL_SESSION_PEPPER:-dev-only-session-pepper-change-me}
  INTEL_LLM_BASE_URL: ${INTEL_LLM_BASE_URL:-http://192.168.1.82:8080/v1}
  INTEL_LLM_API_KEY: ${INTEL_LLM_API_KEY:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  INTEL_GATEWAY_SECRET: ${INTEL_GATEWAY_SECRET:-}
  INTEL_LLM_CONCURRENCY: ${INTEL_LLM_CONCURRENCY:-4}
  INTEL_FETCH_CONCURRENCY: ${INTEL_FETCH_CONCURRENCY:-8}

x-app-build: &app-build
  context: ..
  dockerfile: deploy/Dockerfile.api

x-app-volumes: &app-volumes
  - objects:/var/lib/intel/objects
  - traces:/var/lib/intel/traces

services:
  reverse-proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: *app-build
    environment: *app-environment
    volumes: *app-volumes
    command: ["uvicorn", "intel.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    restart: unless-stopped

  scheduler:
    build: *app-build
    environment: *app-environment
    volumes: *app-volumes
    command: ["intel", "scheduler"]
    restart: unless-stopped
    depends_on:
      - api

  pipeline-worker:
    build: *app-build
    environment: *app-environment
    volumes: *app-volumes
    command: ["intel", "worker", "--role", "pipeline"]
    restart: unless-stopped
    depends_on:
      - api

  fetch-worker:
    build: *app-build
    environment: *app-environment
    volumes: *app-volumes
    command: ["intel", "worker", "--role", "fetch"]
    restart: unless-stopped
    depends_on:
      - api

  research-runner:
    build: *app-build
    environment: *app-environment
    volumes: *app-volumes
    command: ["intel", "worker", "--role", "research"]
    restart: unless-stopped
    depends_on:
      - api

  postgres:
    profiles: ["local-db"]
    build:
      context: ./postgres
      dockerfile: Containerfile
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-intel}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "${PG_PUBLISH_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped

volumes:
  objects:
  traces:
  pgdata:
