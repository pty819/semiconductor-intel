# unifiedllm route registry (spec 14 §3.1) — loaded by the factory via
# nooa.unifiedllm.reload_registry(). Every tier alias points at the LAN
# grok2api OpenAI-compatible endpoint on the NAS (192.168.1.21:8000).
#
# The api_base mirrors Settings.grok2api_base_url's default; deployments
# that move the endpoint edit this file (the registry is the single source
# of truth for route resolution). The API key is NEVER written here —
# api_key_env names the env var the client reads at call time.
#
# Model names are provisional until the M0 real-provider smoke run checks
# grok2api's live model list (doc 12 M0); tiers are assignments, not
# endorsements — M7's golden-set quality/cost comparison re-decides them.
models:
  # L1 量大浅判: routing verdicts, cheap classification.
  L1:
    model_name: openai/grok-3-mini
    api_base: http://192.168.1.21:8000/v1
    api_key_env: GROK2API_KEY
    drop_params: true
  # L2 结构化抽取与撰写: claim extraction, answer drafting.
  L2:
    model_name: openai/grok-3
    api_base: http://192.168.1.21:8000/v1
    api_key_env: GROK2API_KEY
    drop_params: true
  # L3 判断与综合: relation judgement, evolution composition, investigation.
  L3:
    model_name: openai/grok-4
    api_base: http://192.168.1.21:8000/v1
    api_key_env: GROK2API_KEY
    drop_params: true
